        <p class="eyebrow">Biografia</p>
        <h1 class="page-title about-title">Chi sono</h1>

        <figure class="pullquote">
          <blockquote>
            <p class="pullquote-title">Le origini della mia musica: un mangiacassette e una cameretta</p>
            <div class="pullquote-body">
              <p>Mi sono avvicinato alla musica nel periodo delle scuole medie. La mia scuola è sempre stata molto attenta a far sì che i bambini e i ragazzi potessero crescere in relazione con il mondo attraverso diversi sguardi: quello intellettuale, pratico e artistico. Ho partecipato al coro e all’orchestra della scuola iniziando a suonare il flauto traverso. All’età di quattordici anni ho avuto un sassofono tra le mani – un contralto non messo proprio bene – e da quel momento non me ne sono mai separato. Gli anni delle superiori sono stati decisivi: ho frequentato la scuola di musica della mia piccola città e ho potuto coltivare questa passione insieme a nuovi amici con i quali cercavo di cambiare il mondo. Forse in parte ce l’abbiamo fatta, ma sicuramente non abbiamo mai smesso di provarci. Cercavo qualcosa di nuovo: scrivevo musica e utilizzavo gli strumenti che avevo a disposizione. La composizione era sempre il punto di partenza e veniva realizzata con il sax, il flauto traverso o flauti vari, cantando e sperimentando con diverse percussioni, che per anni sono state una mia grande passione. Suonavo musica dal mondo, non avevo un genere di riferimento; pescavo qua e là. Registravo nella mia cameretta con una piccola radio con incorporato un mangia-cassette. Solo, con qualche amico o a volte con la band. Si scriveva, si decideva un canovaccio, o si sceglieva di improvvisare qualcosa. Premuto il tasto Rec rosso iniziava l’esibizione. È nato tutto in quel momento, credo. Qualcuna di quelle cassette esiste ancora in casa mia e di qualche vecchia amica.</p>
            </div>
          </blockquote>
        </figure>

        <figure class="pullquote">
          <blockquote>
            <p class="pullquote-title">L’incontro con il Jazz, la classica e il jazz</p>
            <div class="pullquote-body">
              <p>Solo verso la fine delle scuole superiori mi è capitato tra le mani un disco masterizzato con scritte poche parole: “Parker e Dizzy”. È stato in quel momento che ho pensato: “Caspita il sassofono si può suonare così?” Era Charlie Parker che risuonava nella stanza. Quella musica mi aveva catturato. In quei giorni ho iniziato a farmi delle domande sulla musica e sullo strumento: domande che hanno trovato risposte nel tempo generandone altrettante sulla vita e sulle persone. I miei ascolti si sono spostati su un genere specifico: Il jazz! Sebbene inizialmente sia stato quasi totalizzante, negli anni mi ha permesso di riabbracciare e ascoltare tutti i generi musicali con un interesse e una leggerezza che mi ricordano i miei primi ascolti. Ah, quel primo disco senza nome! Anni dopo avrei scoperto essere la registrazione Live alla Carnegie Hall del 1947. Proprio quella con le iconiche quattro battute di Parker all’inizio del solo di Night in Tunisia. La curiosità, la fame di conoscenza e la necessità di riuscire a comunicare le emozioni maturate negli anni precedenti mi hanno spinto a scegliere definitivamente la strada della musica. Dopo il diploma sono entrato alla civica scuola di jazz di Milano sotto la guida del Maestro Giulio Visibelli e, l’anno successivo al conservatorio “G. Verdi” di Milano dove affronto lo studio del saxofono classico con i Maestri Marco Bontempo, Mario Marzi e Daniele Comoglio, laureandomi sei anni più tardi con il massimo dei voti. Durante questi anni ho la fortuna di suonare in orchestra partecipando come tenorista ad alcune rappresentazioni del Bolero di Ravel con l’orchestra del conservatorio di Milano e altre orchestre del nord Italia e, come altista, in due opere di Sciarrino. Parallelamente, l’aspetto che continuavo a coltivare con maggior dedizione era quello della musica jazz che ha portato alla formazione di diversi gruppi e alla partecipazione come primo alto in diverse big band. Inizio finalmente a muovermi nella scena jazz italiana, incontrando diversi musicisti che ancora oggi trovo al mio fianco e specializzandomi attraverso numerose masterclass e seminari. I seminari di Siena jazz 2014 e 2015 con grandi musicisti come Mark Turner, Ben Wendel, Walter Smith III e Ambrose Akinmusire e i corsi superiori di formazione jazzistica di Ramberto Ciammarughi nel 2016 sono dei momenti cruciali che mi danno lo stimolo giusto per lasciare l’Italia e per trasferirmi a Barcellona. Ramberto rimane sempre uno dei miei mentori, uno dei miei papà musicali più importanti che abbia mai incontrato e che ha saputo leggermi e indirizzarmi. Grazie!</p>
            </div>
          </blockquote>
        </figure>

        <figure class="pullquote">
          <blockquote>
            <p class="pullquote-title">Il rientro in Italia: nuove rotte creative</p>
            <div class="pullquote-body">
              <p>Al mio ritorno in Italia ho trovato un’atmosfera nuova, che ha favorito incontri determinanti e il consolidamento di legami duraturi e formazioni solide. Attualmente opero come leader nei progetti Gianluca Zanello Mòmo, Gianluca Zanello Ùmia e Yellowland Collective. In veste di coleader, collaboro ai progetti I am a fish e Corner of Roses (insieme a Simone Locarni, Marco Rottoli e Stefano Grasso). Come sideman, faccio parte di diverse formazioni, tra cui: Giovanni Falzone Quintet, MutatuM di Stefano Zambon, Dolphians di Federico Calcagno, Archipelagos di Francesca Remigi, Panorchestra di Tino Tracanna, Rosmarino di Vittorio Gravagna. Ho avuto il piacere di condividere il palco e collaborare con figure di spicco del panorama jazzistico nazionale e internazionale, quali Steven Bernstein, Jonathan Finlayson, Fabrizio Bosso, Ramberto Ciammarughi, Alfonso Santimone, Pino Iodice, Walter Ricci, Natanael Ramos, Paola Folli, Attilio Zanchi, Massimo Colombo, Ferdinando Romano, Francesca Remigi, Anais Drago e Yuri Goloubev. Questo periodo è stato scandito da importanti riconoscimenti in prestigiosi concorsi, tra cui il Premio Chicco Bettinardi, il concorso Barga Jazz, Nuova Generazione Jazz, il Jazz Juniors Contest, il Premio del Conservatorio di Milano (Categoria E – Jazz) e il premio unico con borsa di studio per la composizione dedicato al M° Federico Ermirio. L’attività concertistica mi ha portato a esibirmi in rassegne e festival di rilievo internazionale: dal Blue Note Milano al Jazz Book di Bucarest, passando per Bergamo Jazz, l’Edinburgh Jazz Festival, Pisa Jazz, La Grande Notte del Jazz al Teatro Grande di Brescia, la Casa del Jazz di Roma, Macerata Jazz, il Jamboree Jazz Club, la Nova Jazz Cava di Terrassa, il Teatro NOSPR di Katowice e l’Unesco International Jazz Day presso il Manarat Al Saadiyat di Abu Dhabi. Nonostante i numerosi impegni artistici, al rientro in Italia il mio desiderio di approfondimento non si è esaurito. Superata la stasi sociale e lavorativa causata dalla pandemia, nel 2023 ho conseguito con il massimo dei voti il diploma di II livello in Sassofono Jazz presso il Conservatorio “G. Verdi” di Milano, sotto la guida del M° Tino Tracanna. Questo traguardo è stato il volano per intraprendere a Genova un nuovo percorso in Composizione e Arrangiamento con uno dei miei riferimenti artistici di sempre, il M° Paolo Silvestri. Sono stati tre anni densi di scrittura, riflessioni profonde e nuove prospettive che hanno consolidato la mia identità creativa. Il 16 marzo 2026 ho concluso questa splendida esperienza laureandomi con 110 e lode. Il lavoro di ricerca mi ha portato alla creazione di una nuova suite per Big Band che integrerà la discografia del mio progetto Mòmo. Per l’occasione, la musica è stata suonata dal progetto Mòmostrokes, esibendosi nel marzo 2026 in vari jazz club e teatri del Nord Italia.</p>
            </div>
          </blockquote>
        </figure>

        <figure class="pullquote">
          <blockquote>
            <p class="pullquote-title">La didattica: un impegno sociale</p>
            <div class="pullquote-body">
              <p>Parallelamente all’attività concertistica, coltivo da anni la passione per l’insegnamento, ricoprendo attualmente il ruolo di docente di Sassofono Jazz presso il Conservatorio “G. Nicolini” di Piacenza. Ritengo che la didattica e il concertismo siano due mondi inscindibili: entrambi si alimentano a vicenda, aiutandomi a mantenere saldo il focus sull’impegno sociale e culturale del mio percorso umano e musicale. Grazie all’esperienza maturata con allievi di ogni età, ho sviluppato un mio metodo di propedeutica musicale e uno di sassofono (di prossima pubblicazione), rivolti specificamente ai bambini tra i 4 e i 10 anni. Inoltre, sto perfezionando un metodo per l’apprendimento del jazz e dell’improvvisazione che sto già applicando con successo con i miei studenti in Conservatorio.</p>
            </div>
          </blockquote>
        </figure>
