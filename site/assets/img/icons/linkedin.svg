<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" fill="currentColor" role="img" aria-label="LinkedIn">
  <defs>
    <mask id="mask-linkedin" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#000"/>
      <image width="100" height="100" preserveAspectRatio="xMidYMid meet" href="linkedin.png" xlink:href="linkedin.png"/>
    </mask>
  </defs>
  <rect width="100" height="100" fill="currentColor" mask="url(#mask-linkedin)"/>
</svg>
