<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sheet Music — Gianluca Zanello</title>
  <link rel="icon" href="../assets/img/Logo_gian_giallo.png">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main class="site-main">
    <div class="container">
      <p class="eyebrow reveal">Scores</p>
      <h1 class="page-title reveal">Sheet Music</h1>
      <blockquote class="lead">If you feel like playing, reading or watching my music, you'll find a few suggestions below.</blockquote>

      <div class="scores-grid">
        <div class="score-card" data-title="Il Passo dell’Asino Suite" style="background-image:url('../assets/img/passo_asino_anteprima.png')">
          <div class="score-card-inner"><div class="score-title">Il Passo dell’Asino Suite</div></div>
          <div class="score-item-data" data-title="Camelia" data-pdf="../assets/pdf/Mov-1-_Il-Passo-dell_Asino_-anteprima.pdf"></div>
          <div class="score-item-data" data-title="Il passo dell’asino" data-pdf="../assets/pdf/Mov2-_Il-Passo-dell_Asino_-anteprima.pdf"></div>
          <div class="score-item-data" data-title="Kàlathos" data-pdf="../assets/pdf/Mov3-_Il-Passo-dell_Asino_-anteprima.pdf"></div>
          <div class="score-item-data" data-title="I’ve Always Been Here" data-pdf="../assets/pdf/Mov4-_Il-Passo-dell_Asino_-Anteprima.pdf"></div>
        </div>

        <div class="score-card" data-title="Blue Room" style="background-image:url('../assets/img/blue_room_anteprima.png')">
          <div class="score-card-inner"><div class="score-title">Blue Room</div></div>
          <div class="score-item-data" data-title="Blue Room" data-pdf="../assets/pdf/Blue-Room-anteprima.pdf" data-audio="../assets/audio/Blue-room-Chet-_Boni_-Baker.mp3"></div>
        </div>

        <div class="score-card" data-title="Il gioco di Arlecchino" style="background-image:url('../assets/img/arlecchino_anteprima2.png')">
          <div class="score-card-inner"><div class="score-title">Il gioco di Arlecchino</div></div>
          <div class="score-item-data" data-title="Pan de Mej" data-pdf="../assets/pdf/Pag-2-I-Movement-Pan-de-Mej-di-Gianluca-Zanello.pdf" data-audio="../assets/audio/Mov-1-Pan-de-Mej-di-Gianluca-Zanello.mp3"></div>
          <div class="score-item-data" data-title="Firenze" data-pdf="../assets/pdf/Pag-2-II-Movement-Firenze-di-Gianluca-Zanello.pdf" data-audio="../assets/audio/Movimento-2-Firenze-di-Gianluca-Zanello.mp3"></div>
          <div class="score-item-data" data-title="Siendo fiel a los sueños" data-pdf="../assets/pdf/Pag-2-III-Movement-Siendo-fiel-a-los-suenos-di-Gianluca-Zanello.pdf" data-audio="../assets/audio/Mov-3-Siendo-fiel-a-los-suenos-di-Gianluca-Zanello.mp3"></div>
          <div class="score-item-data" data-title="Il gioco di Arlecchino" data-pdf="../assets/pdf/Pag-2-IV-Movement-Il-gioco-di-Arlecchino-Score-title.pdf" data-audio="../assets/audio/Mov-4-Il-Gioco-di-Arlecchino-di-Gianluca-Zanello.mp3"></div>
          <div class="score-item-data" data-title="Chacarero" data-pdf="../assets/pdf/Pag-2-V-Movement-Chacarero-di-Gianluca-Zanello.pdf" data-audio="../assets/audio/Mov-5-Chacarero-di-Gianluca-Zanello.mp3"></div>
        </div>

        <div class="score-card" data-title="Skylark" style="background-image:url('../assets/img/skylark_anteprima2.png')">
          <div class="score-card-inner"><div class="score-title">Skylark</div></div>
          <div class="score-item-data" data-title="Skylark" data-pdf="../assets/pdf/Skylark.pdf" data-audio="../assets/audio/Skylark-suonata-da-me-e-Lolliz-copia.mp3"></div>
        </div>

        <div class="score-card" data-title="Noroc" style="background-image:url('../assets/img/noroc_anteprima.png')">
          <div class="score-card-inner"><div class="score-title">Noroc</div></div>
          <div class="score-item-data" data-title="Noroc" data-pdf="../assets/pdf/Noroc-di-Gianluca-Zanello-anteprima.pdf" data-audio="../assets/audio/05-NOROC-v02.mp3"></div>
        </div>

        <div class="score-card" data-title="Yellow Loud Things" style="background-image:url('../assets/img/yellow_lou_anteprima.png')">
          <div class="score-card-inner"><div class="score-title">Yellow Loud Things</div></div>
          <div class="score-item-data" data-title="Preludio" data-pdf="../assets/pdf/preludio-Tutto-lo-spartito.pdf"></div>
          <div class="score-item-data" data-title="Acelgas" data-pdf="../assets/pdf/acelgas-anteprima.pdf"></div>
          <div class="score-item-data" data-title="Blue Whale" data-pdf="../assets/pdf/blue-whale-anteprima.pdf"></div>
          <div class="score-item-data" data-title="I am a fish" data-pdf="../assets/pdf/I-am-a-fish-anteprima.pdf"></div>
          <div class="score-item-data" data-title="Your soul, your path" data-pdf="../assets/pdf/your-soul-your-path-anteprima.pdf"></div>
          <div class="score-item-data" data-title="Room 303" data-pdf="../assets/pdf/room-303-anteprima.pdf"></div>
          <div class="score-item-data" data-title="Saturday Market" data-pdf="../assets/pdf/saturday-market-anteprima.pdf"></div>
          <div class="score-item-data" data-title="Con Alma" data-pdf="../assets/pdf/4-Con-Alma-anteprima.pdf"></div>
        </div>
      </div>

      <div class="score-drawer" id="scoreDrawer" aria-hidden="true">
        <div class="score-drawer-backdrop" data-close-drawer></div>
        <div class="score-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
          <div class="score-drawer-header">
            <h2 id="drawerTitle"></h2>
            <div class="score-drawer-header-actions">
              <a class="score-open-pdf" id="scoreOpenPdf" href="#" target="_blank" rel="noopener">Open PDF</a>
              <button class="score-drawer-close" type="button" data-close-drawer aria-label="Close">×</button>
            </div>
          </div>
          <div class="score-drawer-body">
            <div class="score-sidebar">
              <nav class="score-tracklist" id="scoreTracklist" aria-label="Tracks"></nav>
              <div class="score-audio-dock" id="scoreAudioDock" hidden>
                <p class="score-audio-label" id="scoreTrackTitle"></p>
                <audio id="scoreAudio" controls class="score-audio"></audio>
              </div>
            </div>
            <div class="score-viewer">
              <iframe class="score-pdf-frame" id="scorePdfFrame" title="Sheet music"></iframe>
              <div class="score-pdf-scroll" id="scorePdfScroll" hidden>
                <div class="score-pdf-pages" id="scorePdfPages"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script>window.GZ = { lang: "en", base: "", assetBase: "../", page: "spartiti" };</script>
  <script src="../assets/js/site.js"></script>
</body>
</html>
